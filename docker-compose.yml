version: '3.8'

services:
  # ========== DEVELOPMENT ==========
  app:
    build:
      context: .
      target: development
    environment:
      - REDIS_URL=redis://bot-redis:6379
    depends_on:
      - redis
    volumes:
      - ./:/app
      - /app/node_modules
    command: npm run dev

  # ========== UNIT TESTS ==========
  app-watch-test:
    build:
      context: .
      target: watch-test
    environment:
      - REDIS_URL=redis://bot-redis:6379
    depends_on:
      - redis
    volumes:
      - ./:/app
      - /app/node_modules

  redis:
    image: redis
    container_name: bot-redis
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes
