version: '3.8'

services:
  app:
    build: ./
    environment:
      - REDIS_URL=redis://bot-redis:6379
    depends_on:
      - redis
    volumes:
      - ./:/app
      - /app/node_modules
  redis:
    image: redis
    container_name: bot-redis
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes