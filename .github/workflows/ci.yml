name: CI Pipline

on:
    push:
        branches:
            - master

jobs:
    build-and-tests:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '18'

            - name: Install dependencies
              run: npm ci

            - name: Run linting
              run: npm run lint

            - name: Check code formatting
              run: npm run format:check

            - name: Run test
              run: npm test

            - name: Build project
              run: npm run build

            - name: Upload build artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: build-output
                  path: |
                      dist/
                      build/
                  if-no-files-found: ignore
